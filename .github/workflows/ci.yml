name: Shadcn UI Kit

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run
